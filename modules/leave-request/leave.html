<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Leave Request | Fresher Hub</title>

  <!-- Compiled from shared/theme.css (Tailwind). Do not edit output.css by hand. -->
  <link rel="stylesheet" href="../../src/output.css">
  <link rel="stylesheet" href="../../styles.css">
</head>

<body class="flex min-h-dvh flex-col">

  <!-- Navigation -->
  <div id="header-bar" class="sticky top-0 z-50 shrink-0"></div>

  <main class="mx-auto w-full max-w-[1255px] flex-1 px-4 py-6 sm:px-6 sm:py-8">

    <div class="mb-6 sm:mb-8">
      <h1 class="text-2xl leading-tight font-bold text-heading sm:text-3xl">Leave Request</h1>
      <p class="mt-2 text-sm text-secondary">Apply for leave and manage your requests.</p>
    </div>

    <div id="app" class="grid grid-cols-1 gap-5 lg:grid-cols-2 lg:gap-6">

      <!-- Apply for Leave -->
      <section class="rounded-2xl border border-line bg-surface shadow-sm">

        <div class="border-b border-line-soft bg-primary-soft/60 px-4 py-4 sm:px-6">
          <h2 class="text-xl leading-tight font-bold text-heading">Apply for Leave</h2>
          <p class="mt-1.5 text-sm text-secondary">Fill in the details below to submit a request.</p>
        </div>

        <form id="leave-form" class="flex flex-col gap-4 px-4 py-5 sm:px-6">

          <div>
            <label for="name" class="mb-1.5 block text-sm font-semibold text-label">Your Name</label>
            <input id="name" type="text" placeholder="Enter your name" required
              pattern=".*\S.*" title="Please enter your name."
              class="h-11 w-full rounded-lg border border-line-input bg-surface px-3 text-sm text-body placeholder:text-muted transition focus:border-primary focus:ring-4 focus:ring-primary-tint focus:outline-none">
          </div>

          <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">

            <div>
              <label for="from" class="mb-1.5 block text-sm font-semibold text-label">From</label>
              <input id="from" type="date" required
                class="h-11 w-full rounded-lg border border-line-input bg-surface px-3 text-sm text-body placeholder:text-muted transition focus:border-primary focus:ring-4 focus:ring-primary-tint focus:outline-none">
            </div>

            <div>
              <label for="to" class="mb-1.5 block text-sm font-semibold text-label">To</label>
              <input id="to" type="date" required
                class="h-11 w-full rounded-lg border border-line-input bg-surface px-3 text-sm text-body placeholder:text-muted transition focus:border-primary focus:ring-4 focus:ring-primary-tint focus:outline-none">
            </div>

          </div>

          <div>
            <label for="status" class="mb-1.5 block text-sm font-semibold text-label">Status</label>
            <select id="status" required
              class="h-11 w-full rounded-lg border border-line-input bg-surface px-3 text-sm text-body placeholder:text-muted transition focus:border-primary focus:ring-4 focus:ring-primary-tint focus:outline-none cursor-pointer">
              <option value="pending">Pending</option>
              <option value="accepted">Accepted</option>
              <option value="rejected">Rejected</option>
            </select>
          </div>

          <div>
            <label for="message" class="mb-1.5 block text-sm font-semibold text-label">Reason</label>
            <textarea id="message" rows="4" required placeholder="Write your reason..."
              class="w-full resize-none rounded-lg border border-line-input bg-surface px-3 py-2.5 text-sm leading-relaxed text-body placeholder:text-muted transition focus:border-primary focus:ring-4 focus:ring-primary-tint focus:outline-none"></textarea>
          </div>

          <button id="sub" type="submit"
            class="h-11 w-full cursor-pointer rounded-lg bg-primary text-sm font-semibold text-white shadow-sm transition focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-ring-strong focus-visible:ring-offset-2 enabled:hover:bg-primary-strong disabled:cursor-not-allowed disabled:opacity-70">
            Apply for Leave
          </button>

        </form>
      </section>

      <!-- My Requests -->
      <section class="rounded-2xl border border-line bg-surface shadow-sm">

        <div class="flex items-start justify-between gap-4 border-b border-line-soft px-4 py-4 sm:px-6">

          <div>
            <h2 class="text-xl leading-tight font-bold text-heading">My Requests</h2>
            <p class="mt-1.5 text-sm text-secondary">Track the status of your leave requests.</p>
          </div>

          <select id="status-filtered" aria-label="Filter by status"
            class="h-9 shrink-0 cursor-pointer rounded-lg border border-line-input bg-surface px-3 text-sm text-body transition focus:border-primary focus:ring-4 focus:ring-primary-tint focus:outline-none">
            <option value="all" selected>All</option>
            <option value="pending">Pending</option>
            <option value="accepted">Accepted</option>
            <option value="rejected">Rejected</option>
          </select>

        </div>

        <div class="px-4 py-5 sm:px-6">
          <div class="scroll-thin max-h-[400px] w-full overflow-x-auto overflow-y-auto rounded-lg border border-line">
            <p id="list-status" class="px-4 py-3 text-sm text-secondary empty:hidden"></p>
            <table id="leave-list" class="w-full text-left text-sm text-body"></table>
          </div>
        </div>

      </section>

    </div>
  </main>

  <!-- Common Footer -->
  <div id="footer-container" class="shrink-0"></div>

  <!-- Mobile Navigation Toggle -->
  <script>
    document.addEventListener("click", function (e) {

      var button = e.target.closest("#menuButton");

      if (button) {
        e.preventDefault();
        e.stopPropagation();

        var scope = button.closest("header") || document;
        var nav = scope.querySelector("#mainNavigation");
        if (!nav) return;

        nav.style.removeProperty("display");
        var isOpen = nav.classList.toggle("nav-open");
        button.setAttribute("aria-expanded", String(isOpen));
        return;
      }

      // Close the menu after tapping a link on mobile
      if (window.innerWidth < 768 && e.target.closest("#mainNavigation a")) {
        var openNav = document.getElementById("mainNavigation");
        if (openNav) openNav.classList.remove("nav-open");
      }

    }, true);
  </script>

  <script src="leave.js"></script>

</body>
</html>
