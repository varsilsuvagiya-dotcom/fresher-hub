
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Leave Request</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="stylesheet" href="../../shared/theme.css">
  <link rel="stylesheet" href="../../styles.css">

  <style>
        .thin-scroll { scrollbar-width: thin; scrollbar-color: #c7d2fe transparent; }
        .thin-scroll::-webkit-scrollbar { width: 6px; }
        .thin-scroll::-webkit-scrollbar-thumb { background: #c7d2fe; border-radius: 10px; }
        .thin-scroll::-webkit-scrollbar-thumb:hover { background: #818cf8; }

        /* --daily-header must match the real navbar height from header.html (py-4 + 40px logo + border) */
        :root { --daily-header: 73px; --daily-footer: 52px; }

        /* Kill any shared top spacing coming from styles.css / theme.css */
        html, body.daily-shell { margin: 0 !important; padding: 0 !important; }

        @media (max-width: 767px) {
            #mainNavigation { width: 100%; flex-direction: column; gap: 8px; }
            #mainNavigation:not(.nav-open) { display: none !important; }
            #mainNavigation.nav-open { display: flex !important; }
        }
        @media (min-width: 768px) {
            #menuButton { display: none !important; }
            #mainNavigation { display: flex !important; width: auto; flex-direction: row; align-items: center; gap: 4px; }
        }
        @media (min-width: 1024px) {
            html, body.daily-shell { height: 100%; }
            body.daily-shell { display: block; min-height: 0; overflow: hidden; }

            .daily-main {
                flex: none;
                height: calc(100vh - var(--daily-header) - var(--daily-footer));
                height: calc(100dvh - var(--daily-header) - var(--daily-footer));
                grid-template-columns: minmax(0, 2fr) minmax(0, 3fr);
                grid-template-rows: minmax(0, 1fr);
                gap: 20px; padding: 20px;
            }
            .daily-main > section { height: 100%; min-height: 0; }
            .daily-fields { flex: 1 1 0; min-height: 0; overflow-y: auto; }
            .daily-desc { display: flex; flex: 1 1 0; flex-direction: column; min-height: 150px; }
            .daily-desc textarea { flex: 1 1 0; height: auto; min-height: 96px; }

            .daily-footer {
                position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
                height: var(--daily-footer); margin: 0;
                display: flex; align-items: center;
            }
            .daily-footer > div { padding-top: 0; padding-bottom: 0; }
        }
    </style>
</head>

<body class="min-h-screen bg-slate-50 text-slate-800">

    <div id="header-bar" class="sticky top-0 z-50"></div>


  <div class="max-w-6xl mx-auto px-4 py-8">

    <div class="mb-8">
      <h1 class="text-3xl font-bold text-slate-800">
        Leave Request
      </h1>

      <p class="text-slate-500 mt-2">
        Apply for leave and manage your requests.
      </p>
    </div>

    <div id="app" class="grid grid-cols-1 lg:grid-cols-2 gap-8">

      <main>
        <section class="bg-white rounded-xl border border-slate-200 shadow-sm p-6">

          <h2 class="text-xl font-semibold mb-6">
            Apply for Leave
          </h2>

          <form id="leave-form" class="space-y-5">

            <div class="flex flex-col gap-2">
              <label for="name" class="text-sm font-medium text-slate-700">
                Your Name
              </label>

              <input
                id="name"
                type="text"
                placeholder="Enter your name"
                required
                class="w-full rounded-lg border border-slate-300 px-4 py-3 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100"
              >
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">

              <div class="flex flex-col gap-2">
                <label for="from" class="text-sm font-medium text-slate-700">
                  From
                </label>

                <input
                  id="from"
                  type="date"
                  class="w-full rounded-lg border border-slate-300 px-4 py-3 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100"
                  required
                >
              </div>

              <div class="flex flex-col gap-2">
                <label for="to" class="text-sm font-medium text-slate-700">
                  To
                </label>

                <input
                  id="to"
                  type="date"
                  class="w-full rounded-lg border border-slate-300 px-4 py-3 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100"
                  required
                >
              </div>

            </div>

            <div class="flex flex-col gap-2">
                <label for="status" class="text-sm font-medium text-slate-700">
                    Status
                </label>

                <select
                    id="status"
                    class="w-full px-4 py-3 bg-white border border-slate-300 rounded-lg text-sm text-slate-700 outline-none cursor-pointer focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 transition"
                    required
                >
                    <option value="pending">Pending</option>
                    <option value="accepted">Accepted</option>
                    <option value="rejected">Rejected</option>
                </select>
            </div>

            <div class="flex flex-col gap-2">
              <label for="message" class="text-sm font-medium text-slate-700">
                Reason
              </label>

              <textarea
                id="message"
                rows="4"
                placeholder="Write your reason..."
                class="w-full rounded-lg border border-slate-300 px-4 py-3 outline-none resize-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100"
                required
              ></textarea>
            </div>

            <button
              id="sub"
              type="submit"
              class="w-full bg-indigo-600 text-white font-medium py-3 rounded-lg hover:bg-indigo-700 active:scale-[0.98] transition"
            >
              Apply for Leave
            </button>

          </form>
        </section>
      </main>

      <section class="bg-white rounded-xl border border-slate-200 shadow-sm p-6">

        <h2 class="text-xl font-semibold mb-6">
          My Requests
        </h2>
        <div class="flex flex-col items-end p-2">
        <select id="status-filtered" class="border-slate-400 bg-slate-200 p-2 rounded-lg">
          <option value="all" selected>All</option>
          <option value="pending">Pending</option>
          <option value="accepted">Accepted</option>
          <option value="rejected">Rejected</option>
        </select>
        </div>

        <div class="w-full max-h-[400px] overflow-y-auto rounded-lg border border-slate-200">
            <p id="list-status"></p>
            <table id="leave-list" class="w-full text-left">
            </table>
        </div>

      </section>

    </div>
  </div>

  <div id="footer-container"></div>
  
  <!-- menu-bar for mobile devices -->
  <script>document.addEventListener("click", function (e) {
        var button = e.target.closest("#menuButton");

        if (button) {
            e.preventDefault();
            e.stopPropagation();

            var scope = button.closest("header") || document;
            var nav = scope.querySelector("#mainNavigation");
            if (!nav) return;

            nav.style.removeProperty("display");               // clear any leftover inline display
            var isOpen = nav.classList.toggle("nav-open");
            button.setAttribute("aria-expanded", String(isOpen));
            return;
        }

        // Close the menu after tapping a link on mobile
        if (window.innerWidth < 768 && e.target.closest("#mainNavigation a")) {
            var openNav = document.getElementById("mainNavigation");
            if (openNav) openNav.classList.remove("nav-open");
        }
    }, true);
    </script>

  <script src="leave.js"></script>

</body>
</html>
