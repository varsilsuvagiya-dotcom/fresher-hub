<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Team directory | Fresher Hu</title>
    <!-- <link rel="stylesheet" href="../../shared/theme.css"> -->
    <link rel="stylesheet" href="../../src/output.css" />
    <link rel="stylesheet" href="../../styles.css" />
  </head>
  <body class="min-h-screen bg-slate-50">
    <div class="flex min-h-screen flex-col">
      <!-- Shared Header -->
      <div id="header"></div>
      <main class="max-w-7xl flex-1 p-5 mx-auto w-full">
        <section class="flex flex-col justify-between items-center sm:flex-row gap-4">
          <h1 class="text-primary text-2xl sm:text-xl font-bold uppercase">Team directory</h1>
          <div>
            <button id="openModal" class="cursor-pointer mr-1 bg-primary text-white rounded-lg px-4 py-2 text-sm font-medium hover:bg-primary/90">+ Add Team</button>
            <input type="search" id="searchInput" placeholder="Search names..." class="w-full sm:w-80 rounded-lg border border-secondary bg-white px-4 py-2 text-heading placeholder:text-secondary focus:border-primary focus:outline-none" />
          </div>
        </section>
        <section>
          <!-- Cards -->
          <div id="teamContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5 mt-5"></div>

          <p id="message" class="text-center mt-8 text-secondary"></p>
        </section>
      </main>
      <!-- Compact footer -->
      <footer class="shrink-0 border-t border-secondary bg-white">
        <div class="mx-auto flex w-full max-w-7xl items-center justify-between px-4 py-2">
          <p class="text-xs font-semibold text-primary">Fresher Hub</p>

          <p class="text-xs text-secondary">Cloudus Infotech · Fresher Batch</p>
        </div>
      </footer>
    </div>
    <!-- Modal  -->
    <div id="memberModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
      <div class="bg-white rounded-xl shadow-xl w-full max-w-md p-6">
        <!-- Modal Header -->
        <div class="flex justify-between items-center mb-5">
          <h2 class="text-xl font-bold text-gray-800">Add Team Member</h2>

          <button id="closeModal" type="button" class="text-gray-500 hover:text-red-500 text-2xl" onclick="hideModal()">&times;</button>
        </div>

        <!-- Form -->
        <form id="memberForm" class="space-y-4">
          <div>
            <label class="block text-sm font-medium mb-1"> Full Name </label>

            <input type="text" id="memberName" placeholder="Enter full name" required class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
          </div>
          <div>
            <label class="block text-sm font-medium mb-1"> Track </label>
            <select id="memberTrack" required class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
              <option value="">Select Track</option>
              <option value="Node">Node</option>
              <option value="Laravel">Laravel</option>
              <option value="Python">Python</option>
              <option value="Java">Java</option>
              <option value="React">React</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium mb-1"> Skills </label>
            <input type="text" id="memberSkills" placeholder="HTML, CSS, JavaScript" required class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
            <p class="text-xs text-gray-500 mt-1">Separate skills using commas.</p>
          </div>
          <div>
            <label class="block text-sm font-medium mb-1"> Profile Image URL (Optional) </label>
            <input type="url" id="memberImage" placeholder="https://example.com/image.jpg" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
          </div>
          <!-- Buttons -->
          <div class="flex gap-3 pt-3">
            <button type="button" id="cancelModal" class="w-1/2 border border-gray-300 rounded-lg py-2 hover:bg-gray-100" onclick="hideModal()">Cancel</button>
            <button type="submit" id="saveMember" class="w-1/2 bg-blue-600 text-white rounded-lg py-2 hover:bg-blue-700">Save Member</button>
          </div>
        </form>
      </div>
    </div>

    <script src="team.js"></script>
  </body>
</html>
