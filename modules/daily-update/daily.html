
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Update | Fresher Hub</title>

    <link rel="stylesheet" href="../../shared/theme.css">
    <link rel="stylesheet" href="../../styles.css">
    <link rel="stylesheet" href="../../src/output.css">

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body.daily-shell {
            margin: 0 !important;
            padding: 0 !important;
            width: 100%;
        }

        .thin-scroll {
            scrollbar-width: thin;
            scrollbar-color: #c7d2fe transparent;
        }

        .thin-scroll::-webkit-scrollbar {
            width: 6px;
        }

        .thin-scroll::-webkit-scrollbar-thumb {
            background: #c7d2fe;
            border-radius: 10px;
        }

        .thin-scroll::-webkit-scrollbar-thumb:hover {
            background: #818cf8;
        }

        :root {
            --daily-header: 73px;
        }

        #header-bar {
            flex-shrink: 0;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        /* Mobile Navigation */
        @media (max-width: 767px) {
            #mainNavigation {
                width: 100%;
                flex-direction: column;
                gap: 8px;
            }

            #mainNavigation:not(.nav-open) {
                display: none !important;
            }

            #mainNavigation.nav-open {
                display: flex !important;
            }
        }

        @media (min-width: 768px) {
            #menuButton {
                display: none !important;
            }

            #mainNavigation {
                display: flex !important;
                width: auto;
                flex-direction: row;
                align-items: center;
                gap: 4px;
            }
        }

        @media (min-width: 1024px) {

            html,
            body.daily-shell {
                min-height: 100%;
            }

            body.daily-shell {
                min-height: 100dvh;
                display: flex;
                flex-direction: column;
                overflow-x: hidden;
                overflow-y: auto;
            }

            /* Main area fits remaining viewport below navbar */
            .daily-main {
                flex: none;
                height: calc(100vh - var(--daily-header));
                height: calc(100dvh - var(--daily-header));

                min-height: 560px;

                grid-template-columns: minmax(0, 2fr) minmax(0, 3fr);
                grid-template-rows: minmax(0, 1fr);

                gap: 20px;
                padding: 16px 20px;
            }

            /* Both panels fit inside main area */
            .daily-main > section {
                height: 100%;
                min-height: 0;
                overflow: hidden;
            }

            /* Form layout */
            #updateForm {
                min-height: 0;
                flex: 1;
                display: flex;
                flex-direction: column;
            }

            .daily-fields {
                flex: 1;
                min-height: 0;
                overflow-y: visible;
                padding-top: 16px;
                padding-bottom: 16px;
                gap: 14px;
            }

            .daily-desc {
                display: flex;
                flex: 1;
                flex-direction: column;
                min-height: 120px;
            }

            .daily-desc textarea {
                flex: 1;
                height: auto;
                min-height: 75px;
            }

            /* Submit button always visible */
            .daily-submit {
                flex-shrink: 0;
                padding-top: 12px;
                padding-bottom: 12px;
            }

            /* History panel */
            .daily-history {
                height: 100% !important;
                min-height: 0;
            }

            /* Only update data scrolls */
            #historyScroll {
                flex: 1;
                min-height: 0;
                overflow-y: auto;
                overflow-x: hidden;
                overscroll-behavior: contain;
            }

            #footer-container {
                flex-shrink: 0;
            }
        }

        /* Smaller screens and tablets */
        @media (max-width: 1023px) {

            body.daily-shell {
                min-height: 100dvh;
                overflow-x: hidden;
                overflow-y: auto;
            }

            .daily-main {
                height: auto;
                min-height: auto;
                flex: 1;
                grid-template-columns: minmax(0, 1fr);
                padding: 16px;
            }

            .daily-main > section {
                min-height: 0;
            }

            #updateForm {
                min-height: 0;
            }

            .daily-fields {
                overflow: visible;
            }

            .daily-history {
                height: 520px;
                max-height: 70vh;
            }

            #historyScroll {
                overflow-y: auto;
                overflow-x: hidden;
            }
        }

        /* Small mobile screens */
        @media (max-width: 480px) {

            .daily-main {
                padding: 12px;
                gap: 14px;
            }

            .daily-fields {
                padding: 16px;
            }

            .daily-submit {
                padding: 12px 16px;
            }

            .daily-history > div:first-child {
                padding: 16px;
            }

            #historyScroll {
                padding: 16px;
            }
        }
    </style>
</head>

<body class="daily-shell m-0 flex min-h-dvh flex-col bg-slate-50 p-0 font-sans text-slate-800 antialiased">

    <!-- Navigation -->
    <div id="header-bar"></div>

    <!-- Main Content -->
    <main class="daily-main mx-auto grid w-full max-w-[1255px] grid-cols-1 gap-4 p-3 sm:p-5">

        <!-- Daily Update Form -->
        <section class="flex min-h-0 flex-col overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm">

            <div class="shrink-0 border-b border-slate-100 bg-indigo-50/60 px-6 py-4">

                <div class="flex items-center gap-3">

                    <!-- <div class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl bg-indigo-600 text-white shadow-sm">

                        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                            stroke-width="1.8" stroke="currentColor" aria-hidden="true">

                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L10.582 16.07a4.5 4.5 0 01-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 011.13-1.897l8.932-8.931zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0115.75 21H5.25A2.25 2.25 0 013 18.75V8.25A2.25 2.25 0 015.25 6H10" />

                        </svg>
                    </div> -->

                    <div>
                        <!-- <span class="text-xs font-semibold uppercase tracking-wider text-indigo-700">
                            Team Workspace
                        </span> -->

                        <h2 class="text-xl font-bold leading-tight text-slate-900">
                            Daily Update
                        </h2>
                    </div>

                </div>

                <p class="mt-2.5 text-sm text-slate-500">
                    Share your daily progress with your team.
                </p>

            </div>

            <form id="updateForm" class="flex min-h-0 flex-1 flex-col">

                <!-- Form Fields -->
                <div class="daily-fields thin-scroll flex flex-col gap-4 px-6 py-5">

                    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">

                        <div>
                            <label for="inpName"
                                class="mb-1.5 block text-sm font-semibold text-slate-700">
                                Your Name
                            </label>

                            <input type="text" id="inpName"
                                placeholder="Enter your name" required
                                class="h-11 w-full rounded-lg border border-slate-300 bg-white px-3 text-sm text-slate-800 placeholder:text-slate-400 transition focus:border-indigo-500 focus:outline-none focus:ring-4 focus:ring-indigo-100">
                        </div>

                        <div>
                            <label for="inpDate"
                                class="mb-1.5 block text-sm font-semibold text-slate-700">
                                Date
                            </label>

                            <input type="date" id="inpDate" required
                                class="h-11 w-full rounded-lg border border-slate-300 bg-white px-3 text-sm text-slate-800 transition focus:border-indigo-500 focus:outline-none focus:ring-4 focus:ring-indigo-100">
                        </div>

                    </div>

                    <div class="daily-desc">

                        <label for="description"
                            class="mb-1.5 block text-sm font-semibold text-slate-700">
                            What I did today
                        </label>

                        <textarea id="description" required
                            placeholder="Describe your completed work and daily progress..."
                            class="h-32 w-full resize-none rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-sm leading-relaxed text-slate-800 placeholder:text-slate-400 transition focus:border-indigo-500 focus:outline-none focus:ring-4 focus:ring-indigo-100"></textarea>

                        <p class="mt-1.5 text-xs text-slate-400">
                            Provide a clear summary of your work.
                        </p>

                    </div>

                    <div>
                        <label for="blocked"
                            class="mb-1.5 block text-sm font-semibold text-slate-700">
                            Blocked On
                        </label>

                        <input type="text" id="blocked"
                            placeholder="Enter blocker or Nothing"
                            class="h-11 w-full rounded-lg border border-slate-300 bg-white px-3 text-sm text-slate-800 placeholder:text-slate-400 transition focus:border-indigo-500 focus:outline-none focus:ring-4 focus:ring-indigo-100">
                    </div>

                </div>

                <!-- Fixed Submit Area -->
                <div class="daily-submit shrink-0 border-t border-slate-100 bg-white px-6 py-4">

                    <button type="submit" id="subBtn"
                        class="h-11 w-full cursor-pointer rounded-lg bg-indigo-600 text-sm font-semibold text-white shadow-sm transition hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-300 focus:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-70">

                        Submit Daily Update &rarr;

                    </button>

                    <p class="mt-2 text-center text-xs text-slate-400">
                        Keep your team informed about your progress.
                    </p>

                </div>

            </form>

        </section>

        <!-- Update History -->
        <section class="daily-history flex min-h-0 flex-col overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm">

            <!-- History Header -->
            <div class="flex shrink-0 items-start justify-between gap-4 border-b border-slate-100 px-6 py-4">

                <div>
                    <!-- <span class="text-xs font-semibold uppercase tracking-wider text-indigo-700">
                        Team Activity
                    </span> -->

                    <h2 class="mt-0.5 text-xl font-bold leading-tight text-slate-900">
                        Update History
                    </h2>

                    <p class="mt-1 text-sm text-slate-500">
                        Review daily progress shared by your team.
                    </p>
                </div>

                <span id="updateCount"
                    class="shrink-0 rounded-full bg-indigo-50 px-3 py-1 text-xs font-semibold text-indigo-700 ring-1 ring-inset ring-indigo-100">
                    0 Updates
                </span>

            </div>

            <!-- Scrollable History Data -->
            <div id="historyScroll"
                class="thin-scroll min-h-0 flex-1 overflow-y-auto overflow-x-hidden px-6 py-5">

                <div id="emptyState"
                    class="flex h-full min-h-[200px] flex-col items-center justify-center text-center">

                    <div class="flex h-14 w-14 items-center justify-center rounded-2xl bg-indigo-50 text-indigo-600">

                        <svg class="h-7 w-7" fill="none" viewBox="0 0 24 24"
                            stroke-width="1.8" stroke="currentColor" aria-hidden="true">

                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L10.582 16.07a4.5 4.5 0 01-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 011.13-1.897l8.932-8.931zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0115.75 21H5.25A2.25 2.25 0 013 18.75V8.25A2.25 2.25 0 015.25 6H10" />

                        </svg>

                    </div>

                    <h3 class="mt-4 text-sm font-semibold text-slate-800">
                        No updates yet
                    </h3>

                    <p class="mt-1 max-w-xs text-sm text-slate-500">
                        Be the first to share today's progress with your team.
                    </p>

                </div>

                <div id="updatesList" class="w-full space-y-3"></div>

            </div>

        </section>

    </main>

    <!-- Common Footer -->
    <div id="footer-container"></div>

    <!-- Mobile Navigation Toggle -->
    <script>
        document.addEventListener("click", function (e) {

            var button = e.target.closest("#menuButton");

            if (button) {

                e.preventDefault();
                e.stopPropagation();

                var scope = button.closest("header") || document;
                var nav = scope.querySelector("#mainNavigation");

                if (!nav) return;

                nav.style.removeProperty("display");

                var isOpen = nav.classList.toggle("nav-open");

                button.setAttribute("aria-expanded", String(isOpen));

                return;
            }

            if (window.innerWidth < 768 && e.target.closest("#mainNavigation a")) {

                var openNav = document.getElementById("mainNavigation");

                if (openNav) {
                    openNav.classList.remove("nav-open");
                }

            }

        }, true);
    </script>

    <script src="daily.js"></script>

</body>
</html>
