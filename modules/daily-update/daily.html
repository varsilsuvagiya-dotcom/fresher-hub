<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Update | Fresher Hub</title>

    <!-- Compiled from shared/theme.css (Tailwind). Do not edit output.css by hand. -->
    <link rel="stylesheet" href="../../src/output.css">

</head>

<body class="flex min-h-dvh flex-col overflow-x-hidden">

    <!-- Navigation -->
    <div id="header-bar" class="sticky top-0 z-50 shrink-0"></div>

    <!-- Main Content -->
    <main class="mx-auto grid w-full max-w-[1255px] flex-1 grid-cols-1 gap-3.5 p-3 sm:gap-4 sm:p-4 lg:h-[calc(100dvh-var(--header-height))] lg:min-h-[560px] lg:flex-none lg:grid-cols-[minmax(0,2fr)_minmax(0,3fr)] lg:grid-rows-[minmax(0,1fr)] lg:gap-5 lg:px-5 lg:py-4">

        <!-- Daily Update Form -->
        <section class="flex min-h-0 flex-col overflow-hidden rounded-2xl border border-line bg-surface shadow-sm lg:h-full">

            <div class="shrink-0 border-b border-line-soft bg-primary-soft/60 px-4 py-4 sm:px-6">
                <h2 class="text-xl leading-tight font-bold text-heading">Daily Update</h2>
                <p class="mt-1.5 text-sm text-secondary">Share your daily progress with your team.</p>
            </div>

            <form id="updateForm" class="flex min-h-0 flex-1 flex-col">

                <!-- Form Fields -->
                <div class="scroll-thin flex flex-col gap-4 px-4 py-4 sm:px-6 sm:py-5 lg:min-h-0 lg:flex-1 lg:gap-3.5 lg:py-4">

                    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">

                        <div>
                            <label for="inpName" class="mb-1.5 block text-sm font-semibold text-label">Your Name</label>
                            <input type="text" id="inpName" placeholder="Enter your name" required
                                pattern=".*\S.*" title="Please enter your name."
                                class="field-input">
                        </div>

                        <div>
                            <label for="inpDate" class="mb-1.5 block text-sm font-semibold text-label">Date</label>
                            <input type="date" id="inpDate" required
                                class="field-input">
                        </div>

                    </div>

                    <div class="flex flex-col lg:min-h-[120px] lg:flex-1">

                        <label for="description" class="mb-1.5 block text-sm font-semibold text-label">What I did today</label>

                        <textarea id="description" required
                            placeholder="Describe your completed work and daily progress..."
                            class="field h-32 resize-none py-2.5 leading-relaxed lg:h-auto lg:min-h-[75px] lg:flex-1"></textarea>

                        <p class="mt-1.5 text-xs text-muted">Provide a clear summary of your work.</p>

                    </div>

                    <div>
                        <label for="blocked" class="mb-1.5 block text-sm font-semibold text-label">Blocked On</label>
                        <input type="text" id="blocked" placeholder="Enter blocker or Nothing"
                            class="field-input">
                    </div>

                </div>

                <!-- Fixed Submit Area -->
                <div class="shrink-0 border-t border-line-soft bg-surface px-4 py-4 sm:px-6 lg:py-3">

                    <button type="submit" id="subBtn"
                        class="btn-primary w-full">
                        Submit Daily Update &rarr;
                    </button>

                    <p class="mt-2 text-center text-xs text-muted">Keep your team informed about your progress.</p>

                </div>

            </form>

        </section>

        <!-- Update History -->
        <section class="flex h-[520px] max-h-[70vh] min-h-0 flex-col overflow-hidden rounded-2xl border border-line bg-surface shadow-sm lg:h-full lg:max-h-none">

            <!-- History Header -->
            <div class="flex shrink-0 items-start justify-between gap-4 border-b border-line-soft px-4 py-4 sm:px-6">

                <div>
                    <h2 class="text-xl leading-tight font-bold text-heading">Update History</h2>
                    <p class="mt-1.5 text-sm text-secondary">Review daily progress shared by your team.</p>
                </div>

                <span id="updateCount"
                    class="shrink-0 rounded-full bg-primary-soft px-3 py-1 text-xs font-semibold whitespace-nowrap text-primary-strong ring-1 ring-primary-tint ring-inset">
                    0 Updates
                </span>

            </div>

            <!-- Scrollable History Data -->
            <div id="historyScroll" class="scroll-thin min-h-0 flex-1 overflow-x-hidden overflow-y-auto px-4 py-4 sm:px-6 sm:py-5 lg:overscroll-contain">

                <div id="emptyState" class="flex h-full min-h-[200px] flex-col items-center justify-center text-center">

                    <div class="flex size-14 items-center justify-center rounded-2xl bg-primary-soft text-primary">

                        <svg class="size-7" fill="none" viewBox="0 0 24 24"
                            stroke-width="1.8" stroke="currentColor" aria-hidden="true">

                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L10.582 16.07a4.5 4.5 0 01-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 011.13-1.897l8.932-8.931zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0115.75 21H5.25A2.25 2.25 0 013 18.75V8.25A2.25 2.25 0 015.25 6H10" />

                        </svg>

                    </div>

                    <h3 class="mt-4 text-sm font-semibold text-body">No updates yet</h3>

                    <p class="mt-1 max-w-xs text-sm text-secondary">Be the first to share today's progress with your team.</p>

                </div>

                <div id="updatesList"></div>

            </div>

        </section>

    </main>

    <!-- Common Footer -->
    <div id="footer-container" class="shrink-0"></div>

    <!-- Mobile Navigation Toggle -->
    <script>
        document.addEventListener("click", function (e) {

            var button = e.target.closest("#menuButton");

            if (button) {

                e.preventDefault();
                e.stopPropagation();

                var scope = button.closest("header") || document;
                var nav = scope.querySelector("#mainNavigation");

                if (!nav) return;

                nav.style.removeProperty("display");

                var isOpen = nav.classList.toggle("nav-open");

                button.setAttribute("aria-expanded", String(isOpen));

                return;
            }

            if (window.innerWidth < 768 && e.target.closest("#mainNavigation a")) {

                var openNav = document.getElementById("mainNavigation");

                if (openNav) {
                    openNav.classList.remove("nav-open");
                }

            }

        }, true);
    </script>

    <script src="daily.js"></script>

</body>
</html>
