<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notice Board | Fresher Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased min-h-screen">

  <!-- header -->
   <div id="header-bar" class="sticky top-0 z-50"></div>

  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
    <div class="mb-8">
      <p class="text-xs font-semibold uppercase tracking-wider text-indigo-600 mb-1">Workspace</p>
      <h1 class="text-3xl font-bold text-slate-900 tracking-tight">Notice board</h1>
    </div>

    <div id="app" class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">

      <main class="lg:col-span-4 bg-white rounded-2xl border border-slate-300/80 shadow-sm p-6">
        <section>
          <h2 class="text-lg font-bold text-slate-900 mb-5">Post a notice</h2>

          <form class="space-y-4">
            <div>
              <label for="title" class="block text-sm font-medium text-slate-700 mb-1.5">
                Title
              </label>
              <input 
                id="title" 
                type="text" 
                placeholder="Enter title" 
                required
                class="w-full px-3.5 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl text-slate-900 placeholder-slate-400 focus:outline-none focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition"
              >
            </div>

            <div>
              <label for="message" class="block text-sm font-medium text-slate-700 mb-1.5">
                Message
              </label>
              <textarea 
                id="message" 
                rows="4" 
                placeholder="Write your reason..." 
                required
                class="w-full px-3.5 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl text-slate-900 placeholder-slate-400 focus:outline-none focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition resize-y"
              ></textarea>
            </div>

            <button 
              id="notice-post"
              class="w-full sm:w-auto px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 disabled:opacity-50 text-white text-sm font-semibold rounded-xl shadow-sm transition cursor-pointer"
            >
              Post notice
            </button>
          </form>
        </section>
      </main>
      
      <section class="lg:col-span-8">
      <div class="flex items-center justify-between gap-4 mb-4">
        <h2 class="text-lg font-bold text-slate-900">
          All notices
        </h2>

        
      </div>

      <div>
        <p id="list-status" class="text-sm text-slate-500 mb-3"></p>
        <ul id="notice-list" class="space-y-4 max-h-[70vh] overflow-y-auto pr-2"></ul>
      </div>
    </section>


    </div>
  </div>

  <script src="notice.js"></script>
</body>
</html>
