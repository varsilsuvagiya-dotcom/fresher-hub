<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notice Board | Fresher Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../../shared/theme.css">
  <link rel="stylesheet" href="../../styles.css">

  <style>
        .thin-scroll { scrollbar-width: thin; scrollbar-color: #c7d2fe transparent; }
        .thin-scroll::-webkit-scrollbar { width: 6px; }
        .thin-scroll::-webkit-scrollbar-thumb { background: #c7d2fe; border-radius: 10px; }
        .thin-scroll::-webkit-scrollbar-thumb:hover { background: #818cf8; }

        /* --daily-header must match the real navbar height from header.html (py-4 + 40px logo + border) */
        :root { --daily-header: 73px; --daily-footer: 52px; }

        /* Kill any shared top spacing coming from styles.css / theme.css */
        html, body.daily-shell { margin: 0 !important; padding: 0 !important; }

        @media (max-width: 767px) {
            #mainNavigation { width: 100%; flex-direction: column; gap: 8px; }
            #mainNavigation:not(.nav-open) { display: none !important; }
            #mainNavigation.nav-open { display: flex !important; }
        }
        @media (min-width: 768px) {
            #menuButton { display: none !important; }
            #mainNavigation { display: flex !important; width: auto; flex-direction: row; align-items: center; gap: 4px; }
        }
        @media (min-width: 1024px) {
            html, body.daily-shell { height: 100%; }
            body.daily-shell { display: block; min-height: 0; overflow: hidden; }

            .daily-main {
                flex: none;
                height: calc(100vh - var(--daily-header) - var(--daily-footer));
                height: calc(100dvh - var(--daily-header) - var(--daily-footer));
                grid-template-columns: minmax(0, 2fr) minmax(0, 3fr);
                grid-template-rows: minmax(0, 1fr);
                gap: 20px; padding: 20px;
            }
            .daily-main > section { height: 100%; min-height: 0; }
            .daily-fields { flex: 1 1 0; min-height: 0; overflow-y: auto; }
            .daily-desc { display: flex; flex: 1 1 0; flex-direction: column; min-height: 150px; }
            .daily-desc textarea { flex: 1 1 0; height: auto; min-height: 96px; }

            .daily-footer {
                position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
                height: var(--daily-footer); margin: 0;
                display: flex; align-items: center;
            }
            .daily-footer > div { padding-top: 0; padding-bottom: 0; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased min-h-screen">

  <!-- header -->
   <div id="header-bar" class="sticky top-0 z-50"></div>

  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <div class="mb-10">
      <p class="text-xs font-semibold uppercase tracking-wider text-indigo-600 mb-1">Workspace</p>
      <h1 class="text-3xl font-bold text-slate-900 tracking-tight">Notice board</h1>
    </div>

    <div id="app" class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">

      <main class="lg:col-span-4 bg-white rounded-2xl border border-slate-500 shadow-sm p-6">
        <section>
          <h2 class="text-2xl font-bold text-slate-900 mb-5">Post a notice</h2>

          <form class="space-y-10">
            <div>
              <label for="title" class="block text-m font-medium text-slate-800 mb-1.5">
                Title
              </label>
              <input 
                id="title" 
                type="text" 
                placeholder="Enter title" 
                required
                class="w-full px-3.5 py-2.5 text-sm bg-slate-50 border border-slate-400 rounded-xl text-slate-900 placeholder-slate-400 focus:outline-none focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition"
              >
            </div>

            <div>
              <label for="message" class="block text-m font-medium text-slate-800 mb-1.5">
                Message
              </label>
              <textarea 
                id="message" 
                rows="4" 
                placeholder="Write your reason..." 
                required
                class="w-full px-3.5 py-2.5 text-sm bg-slate-50 border border-slate-400 rounded-xl text-slate-900 placeholder-slate-400 focus:outline-none focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition resize-y"
              ></textarea>
            </div>

            <button 
              id="notice-post"
              class="w-full sm:w-auto px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 disabled:opacity-50 text-white text-sm font-semibold rounded-xl shadow-sm transition cursor-pointer"
            >
              Post notice
            </button>
          </form>
        </section>
      </main>
      
      <section class="lg:col-span-8">
      <div class="flex items-center justify-between gap-4 mb-4">
        <h2 class="text-lg font-bold text-slate-900">
          All notices
        </h2>
        
      <select 
          id="month-filter"
          class="px-3.5 py-2 text-sm bg-white border border-slate-200 rounded-xl text-slate-700 font-medium focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition cursor-pointer"
        >
          <option value="all">All months</option>
          <option value="Jan">January</option>
          <option value="Feb">February</option>
          <option value="Mar">March</option>
          <option value="Apr">April</option>
          <option value="May">May</option>
          <option value="Jun">June</option>
          <option value="Jul">July</option>
          <option value="Aug">August</option>
          <option value="Sep">September</option>
          <option value="Oct">October</option>
          <option value="Nov">November</option>
          <option value="Dec">December</option>
        </select>
        
      </div>

      <div>
        <p id="list-status" class="text-sm text-slate-500 mb-3"></p>
        <ul id="notice-list" class="space-y-4 max-h-[70vh] overflow-y-auto pr-2"></ul>
      </div>
    </section>

    </div>
  </div>

  <!-- footer -->
  <div id="footer-container"></div>

  <!-- menu-bar for mobile devices -->
  <script>document.addEventListener("click", function (e) {
        var button = e.target.closest("#menuButton");

        if (button) {
            e.preventDefault();
            e.stopPropagation();

            var scope = button.closest("header") || document;
            var nav = scope.querySelector("#mainNavigation");
            if (!nav) return;

            nav.style.removeProperty("display");               // clear any leftover inline display
            var isOpen = nav.classList.toggle("nav-open");
            button.setAttribute("aria-expanded", String(isOpen));
            return;
        }

        // Close the menu after tapping a link on mobile
        if (window.innerWidth < 768 && e.target.closest("#mainNavigation a")) {
            var openNav = document.getElementById("mainNavigation");
            if (openNav) openNav.classList.remove("nav-open");
        }
    }, true);
    </script>

  <script src="notice.js"></script>
</body>
</html>
