
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Notice Board | Fresher Hub</title>

  <link rel="stylesheet" href="../../src/output.css">
  <link rel="stylesheet" href="../../styles.css">
</head>

<body class="min-h-screen">

  <!-- Header -->
  <div id="header-bar" class="sticky top-0 z-50"></div>

  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 sm:py-12">

    <div class="mb-8 sm:mb-10">
      <p class="text-xs font-semibold uppercase tracking-wider text-primary mb-1">
        Workspace
      </p>

      <h1 class="text-3xl font-bold text-heading tracking-tight">
        Notice Board
      </h1>

      <p class="text-sm text-secondary mt-2">
        Share important updates and stay informed.
      </p>
    </div>

    <div id="app" class="grid grid-cols-1 lg:grid-cols-12 gap-6 lg:gap-8 items-start">

      <main class="lg:col-span-4 bg-surface rounded-xl border border-line shadow-sm p-5 sm:p-6">

        <section>
          <h2 class="text-xl font-bold text-heading mb-6">
            Post a Notice
          </h2>

          <form id="notice-form" class="space-y-6">

            <div>
              <label for="title" class="block text-sm font-medium text-label mb-2">
                Title
              </label>

              <input
                id="title"
                type="text"
                placeholder="Enter notice title"
                required
                class="field-input"
              >
            </div>

            <div>
              <label for="message" class="block text-sm font-medium text-label mb-2">
                Message
              </label>

              <textarea
                id="message"
                rows="5"
                placeholder="Write your notice..."
                required
                class="field w-full min-h-32 resize-y py-3"
              ></textarea>
            </div>

            <button
              id="notice-post"
              type="submit"
              class="btn-primary w-full sm:w-auto"
            >
              Post Notice
            </button>

          </form>
        </section>

      </main>

      <section class="lg:col-span-8 min-w-0">

        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-5">

          <h2 class="text-xl font-bold text-heading">
            All Notices
          </h2>

          <select
            id="month-filter"
            class="field-input w-full sm:w-auto cursor-pointer"
          >
            <option value="all">All months</option>
            <option value="Jan">January</option>
            <option value="Feb">February</option>
            <option value="Mar">March</option>
            <option value="Apr">April</option>
            <option value="May">May</option>
            <option value="Jun">June</option>
            <option value="Jul">July</option>
            <option value="Aug">August</option>
            <option value="Sep">September</option>
            <option value="Oct">October</option>
            <option value="Nov">November</option>
            <option value="Dec">December</option>
          </select>

        </div>

        <p id="list-status" class="text-sm text-secondary mb-4"></p>

        <ul
          id="notice-list"
          class="space-y-4 max-h-[600px] overflow-y-auto overflow-x-hidden scroll-thin pr-3"
        >
        </ul>

        </ul>

      </section>

    </div>

  </div>

  <!-- Footer -->
  <div id="footer-container"></div>

  <!-- Mobile Navigation -->
  <script>
    document.addEventListener("click", function (e) {

      var button = e.target.closest("#menuButton");

      if (button) {
        e.preventDefault();
        e.stopPropagation();

        var scope = button.closest("header") || document;
        var nav = scope.querySelector("#mainNavigation");

        if (!nav) return;

        nav.style.removeProperty("display");

        var isOpen = nav.classList.toggle("nav-open");

        button.setAttribute("aria-expanded", String(isOpen));

        return;
      }

      if (
        window.innerWidth < 768 &&
        e.target.closest("#mainNavigation a")
      ) {
        var openNav = document.getElementById("mainNavigation");

        if (openNav) {
          openNav.classList.remove("nav-open");
        }
      }

    }, true);
  </script>

  <script src="notice.js"></script>

</body>
</html>
