<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Events | Fresher Hub</title>
    <link rel="stylesheet" href="../../src/output.css" />
    <link rel="stylesheet" href="../../styles.css" />
  </head>
  <body class="min-h-screen bg-slate-50">
    <!-- Shared Header -->
    <div id="header" class="sticky top-0 z-50 shrink-0"></div>
    <main class="mx-auto w-full max-w-7xl p-5">
      <h1 class="mb-6 text-2xl font-bold sm:text-3xl">Events</h1>
      <div class="grid grid-cols-1 gap-8 md:grid-cols-3">
        <!-- Left:  Form -->
        <section class="h-fit border border-slate-300 bg-white rounded-2xl">
          <!-- <h2 class="mb-4 text-xl font-bold">Add an event</h2> -->

          <div class="shrink-0 border-b border-line-soft bg-primary-soft/60 px-4 py-4 sm:px-6">
            <h2 class="text-lg sm:text-xl leading-tight font-bold text-heading">Add an event</h2>
            <p class="mt-1.5 text-sm text-secondary">Add important events, meetings for your team.</p>
          </div>

          <form id="eventForm" class="space-y-4 p-3 sm:px-5">
            <!-- Event Name -->
            <div>
              <label for="eventName" class="mb-2 text-sm font-medium"> Event name </label>
              <input type="text" id="eventName" name="eventName" placeholder="Event name" class="field-input" required />
            </div>
            <!-- Date and Time -->
            <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">
              <div>
                <label for="eventDate" class="mb-2 block text-sm font-medium"> Date </label>
                <input type="date" id="eventDate" name="eventDate" required class="field-input" />
              </div>
              <div>
                <label for="eventTime" class="mb-2 block text-sm font-medium"> Time </label>
                <input type="time" id="eventTime" name="eventTime" required class="field-input" />
              </div>
            </div>
            <!-- Place -->
            <div>
              <label for="eventPlace" class="mb-2 block text-sm font-medium"> Place </label>
              <input type="text" id="eventPlace" name="eventPlace" placeholder="Room or online link" required class="field-input" />
            </div>
            <!-- Submit Button -->
            <button type="submit" id="addEventBtn" class="btn-primary w-full">Add Event</button>
          </form>
        </section>
        <!-- Right: Events List -->
        <section class="md:col-span-2 rounded-2xl">
          <p id="message" class="text-center mt-8 text-secondary"></p>
          <!-- Upcoming Events -->
          <div class="mb-5 border border-slate-300 bg-white shadow-sm p-4 rounded-2xl">
            <h2 class="mb-2 text-lg font-bold text-primary">Upcoming</h2>
            <div class="h-[350px] max-h-[70vh] overflow-y-auto pr-5">
              <p id="upcomingMessage" class="text-center mt-8 text-secondary"></p>
              <div id="upcomingEvents" class="space-y-3"></div>
            </div>
          </div>
          <!-- Past Events -->
          <div class="space-y-3 border border-slate-300 bg-slate-50 shadow-sm p-4 rounded-2xl">
            <h2 class="mb-2 text-lg font-bold text-primary">Past events</h2>
            <div class="h-[350px] max-h-[70vh] overflow-y-auto pr-5">
              <p id="pastMessage" class="text-center mt-8 text-secondary"></p>
              <div id="pastEvents" class="space-y-3"></div>
            </div>
          </div>
        </section>
      </div>
    </main>

    <!-- Shared Footer -->
    <div id="footer-container"></div>

    <!-- Mobile Navigation -->
  <script>
    document.addEventListener("click", function (e) {

      var button = e.target.closest("#menuButton");

      if (button) {
        e.preventDefault();
        e.stopPropagation();

        var scope = button.closest("header") || document;
        var nav = scope.querySelector("#mainNavigation");

        if (!nav) return;

        nav.style.removeProperty("display");

        var isOpen = nav.classList.toggle("nav-open");

        button.setAttribute("aria-expanded", String(isOpen));

        return;
      }

      if (
        window.innerWidth < 768 &&
        e.target.closest("#mainNavigation a")
      ) {
        var openNav = document.getElementById("mainNavigation");

        if (openNav) {
          openNav.classList.remove("nav-open");
        }
      }

    }, true);
  </script>

    <script src="events.js"></script>
  </body>
</html>
