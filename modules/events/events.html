<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Team directory | Fresher Hu</title>
    <!-- <link rel="stylesheet" href="../../shared/theme.css"> -->
    <link rel="stylesheet" href="../../src/output.css" />
    <link rel="stylesheet" href="../../styles.css" />
  </head>
  <body class="min-h-screen bg-slate-50">
    <!-- Shared Header -->
    <div id="header"></div>
    <main class="w-full max-w-7xl p-5 mx-auto"></main>
    <h1 class="text-2xl sm:text-xl font-bold">Events</h1>
    <div id="app">
      <form id="eventForm">
        <h3>Add an event</h3>

        <div>
          <label for="eventName">Event name</label>
          <input type="text" placeholder="[Event name]" id="inpEvent" />
        </div>
        <div>
          <div>
            <label for="date">Date</label>
            <input type="date" id="inpDate" />
          </div>
          <div>
            <label for="time">Time</label>
            <input type="time" id="inpTime" />
          </div>
        </div>
        <div>
          <label for="place">Place</label>
          <input type="text" placeholder="[Room or online link]" id="inpText" />
        </div>
        <div>
          <button type="submit" id="subBtn">Add event</button>
        </div>
      </form>
    </div>
    <div id="eventList"></div>
    <!-- Shared Footer -->
    <div id="footer-container"></div>

    <script src="events.js"></script>
  </body>
</html>
