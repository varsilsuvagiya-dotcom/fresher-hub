<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Events | Fresher Hu</title>
    <link rel="stylesheet" href="../../src/output.css" />
    <link rel="stylesheet" href="../../styles.css" />
  </head>
  <body class="min-h-screen bg-slate-50">
    <!-- Shared Header -->
    <div id="header"></div>
    <main class="mx-auto w-full max-w-7xl p-5">
      <h1 class="mb-6 text-2xl font-bold sm:text-2xl">Events</h1>
      <div class="grid grid-cols-1 gap-8 md:grid-cols-3">
        <!-- Left:  Form -->
        <section class="h-fit border border-slate-300 bg-white p-5 sm:p-6">
          <h2 class="mb-4 text-xl font-bold">Add an event</h2>
          <form id="eventForm" class="space-y-4">
            <!-- Event Name -->
            <div>
              <label for="eventName" class="mb-2 text-sm font-medium"> Event name </label>
              <input type="text" id="eventName" name="eventName" placeholder="Event name" class="field-input" required />
            </div>
            <!-- Date and Time -->
            <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">
              <div>
                <label for="eventDate" class="mb-2 block text-sm font-medium"> Date </label>
                <input type="date" id="eventDate" name="eventDate" required class="field-input" />
              </div>
              <div>
                <label for="eventTime" class="mb-2 block text-sm font-medium"> Time </label>
                <input type="time" id="eventTime" name="eventTime" required class="field-input" />
              </div>
            </div>
            <!-- Place -->
            <div>
              <label for="eventPlace" class="mb-2 block text-sm font-medium"> Place </label>
              <input type="text" id="eventPlace" name="eventPlace" placeholder="Room or online link" required class="field-input" />
            </div>
            <!-- Submit Button -->
            <button type="submit" id="addEventBtn" class="btn-primary w-full">Add Event</button>
          </form>
        </section>
        <!-- Right: Events List -->
        <section class="md:col-span-2">
          <!-- Upcoming Events -->
          <div class="mb-3">
            <h2 class="mb-2 text-lg font-bold text-primary">Upcoming</h2>
            <p id="upcomingMessage" class="text-center mt-8 text-secondary"></p>
            <div id="upcomingEvents" class="space-y-3"></div>
          </div>
          <div>
            <h2 class="mb-2 text-lg font-bold text-primary">Past events</h2>
            <p id="pastMessage" class="text-center mt-8 text-secondary"></p>
            <div id="pastEvents" class="space-y-3"></div>
          </div>
        </section>
      </div>
    </main>

    <!-- Shared Footer -->
    <div id="footer-container"></div>
    <script src="events.js"></script>
  </body>
</html>
