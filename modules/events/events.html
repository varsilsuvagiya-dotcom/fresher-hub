<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Team directory | Fresher Hu</title>
    <!-- <link rel="stylesheet" href="../../shared/theme.css"> -->
    <link rel="stylesheet" href="../../src/output.css" />
    <link rel="stylesheet" href="../../styles.css" />
  </head>
  <body class="min-h-screen bg-slate-50">
    <!-- Shared Header -->
    <div id="header"></div>
    <main class="mx-auto w-full max-w-7xl p-5">
      <!-- Page Title -->
      <h1 class="mb-6 text-2xl font-bold sm:text-2xl">Events</h1>

      <div class="grid grid-cols-1 gap-8 md:grid-cols-3">
        <!-- Left:  Form -->
        <section class="h-fit border border-slate-300 bg-white p-5 sm:p-6">
          <h2 class="mb-4 text-xl font-bold">Add an event</h2>

          <form id="eventForm" class="space-y-4">
            <!-- Event Name -->
            <div>
              <label for="eventName" class="mb-2 text-sm font-medium"> Event name </label>
              <input type="text" id="eventName" name="eventName" placeholder="Event name" class="field-input" required />
            </div>

            <!-- Date and Time -->
            <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">
              <div>
                <label for="eventDate" class="mb-2 block text-sm font-medium"> Date </label>
                <input type="date" id="eventDate" name="eventDate" required class="field-input" />
              </div>

              <div>
                <label for="eventTime" class="mb-2 block text-sm font-medium"> Time </label>
                <input type="time" id="eventTime" name="eventTime" required class="field-input" />
              </div>
            </div>

            <!-- Place -->
            <div>
              <label for="eventPlace" class="mb-2 block text-sm font-medium"> Place </label>
              <input type="text" id="eventPlace" name="eventPlace" placeholder="Room or online link" required class="field-input" />
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn-primary w-full">Add event</button>
          </form>
        </section>

        <!-- Right: Events List -->
        <section class="md:col-span-2">
          <!-- Upcoming Events -->
          <div class="mb-7">
            <h2 class="mb-3 text-lg font-bold">Upcoming</h2>

            <div id="upcomingEvents" class="space-y-3">
              <!-- Static Event Card 1 -->
              <article class="flex items-center gap-4 border border-slate-800 bg-white p-3 sm:p-4">
                <!-- Date Box -->
                <div class="flex h-16 w-20 shrink-0 flex-col items-center justify-center border border-slate-800">
                  <span class="text-xs text-indigo-700">[Mon]</span>
                  <span class="text-2xl font-bold">[DD]</span>
                </div>

                <!-- Event Details -->
                <div class="min-w-0">
                  <h3 class="font-bold">[Event name]</h3>

                  <p class="mt-1 text-sm text-slate-600">[Time] · [Place]</p>
                </div>
              </article>

              <!-- Static Event Card 2 -->
              <article class="flex items-center gap-4 border border-slate-800 bg-white p-3 sm:p-4">
                <div class="flex h-16 w-20 shrink-0 flex-col items-center justify-center border border-slate-800">
                  <span class="text-xs text-indigo-700">[Mon]</span>
                  <span class="text-2xl font-bold">[DD]</span>
                </div>

                <div class="min-w-0">
                  <h3 class="font-bold">[Event name]</h3>

                  <p class="mt-1 text-sm text-slate-600">[Time] · [Place]</p>
                </div>
              </article>
            </div>
          </div>

          <!-- Past Events -->
          <div>
            <h2 class="mb-3 text-lg font-bold text-slate-600">Past events</h2>

            <div id="pastEvents" class="space-y-3">
              <!-- Static Past Event Card -->
              <article class="flex items-center gap-4 border border-slate-300 bg-slate-100 p-3 text-slate-500 sm:p-4">
                <div class="flex h-16 w-20 shrink-0 flex-col items-center justify-center border border-slate-400">
                  <span class="text-xs">[Mon]</span>
                  <span class="text-2xl font-bold">[DD]</span>
                </div>

                <div class="min-w-0">
                  <h3 class="font-bold">[Event name]</h3>

                  <p class="mt-1 text-sm">[Time] · [Place]</p>
                </div>
              </article>
            </div>
          </div>

          <div id="eventList"></div>
        </section>
      </div>
    </main>

    <!-- Shared Footer -->
    <div id="footer-container"></div>

    <script src="events.js"></script>
  </body>
</html>
