<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resources | Fresher Hub</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Shared CSS -->
    <link rel="stylesheet" href="../../shared/theme.css">
</head>

<body class="m-0 min-h-screen bg-slate-50 text-slate-800">

    <!-- Shared Header -->
    <div id="header"></div>

    <main class="max-w-7xl mx-auto px-5 py-10">

        <!-- Heading -->
        <div class="mb-8">
            <p class="text-indigo-600 font-semibold text-sm uppercase tracking-wider">
                Fresher Hub
            </p>
            <h1 class="text-3xl font-bold mt-2">Learning Resources</h1>
            <p class="text-slate-500 mt-2">
                Find and share useful learning resources with your team.
            </p>
        </div>

        <!-- Search -->
        <div class="mb-8">
            <input
                type="search"
                id="searchInput"
                placeholder="Search resources..."
                class="w-full bg-white border border-slate-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500"
            >
        </div>

        <!-- Add Resource -->
        <section class="bg-white border border-slate-200 rounded-2xl shadow-sm p-6 mb-10">

            <h2 class="text-xl font-bold mb-5">Add New Resource</h2>

            <form id="resourceForm" class="grid grid-cols-1 md:grid-cols-2 gap-5">

                <div>
                    <label class="block text-sm font-medium mb-2">Topic</label>
                    <select
                        id="topic"
                        required
                        class="w-full border border-slate-300 rounded-lg px-4 py-3 bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    >
                        <option value="">Select Topic</option>
                        <option value="HTML and CSS">HTML and CSS</option>
                        <option value="JavaScript">JavaScript</option>
                        <option value="Git">Git</option>
                        <option value="Python">Python</option>
                        <option value="React">React</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium mb-2">Resource Title</label>
                    <input
                        type="text"
                        id="title"
                        placeholder="Enter resource title"
                        required
                        class="w-full border border-slate-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    >
                </div>

                <div>
                    <label class="block text-sm font-medium mb-2">Resource URL</label>
                    <input
                        type="url"
                        id="url"
                        placeholder="https://example.com"
                        required
                        class="w-full border border-slate-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    >
                </div>

                <div>
                    <label class="block text-sm font-medium mb-2">Description</label>
                    <input
                        type="text"
                        id="description"
                        placeholder="Enter description"
                        class="w-full border border-slate-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    >
                </div>

                <div class="md:col-span-2">
                    <button
                        type="submit"
                        class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-6 py-3 rounded-lg transition"
                    >
                        + Add Resource
                    </button>
                </div>

            </form>

            <p id="formMessage" class="text-sm mt-4"></p>
        </section>

        <!-- Resource Cards -->
        <section>
            <div class="flex justify-between items-center mb-5">
                <h2 class="text-xl font-bold">Available Resources</h2>
                <span id="resourceCount" class="text-sm text-slate-500"></span>
            </div>

            <div
                id="resourceContainer"
                class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"
            >
                <p class="text-slate-500">Loading resources...</p>
            </div>
        </section>

    </main>
    <!--  Footer -->
   <div id="footer-container"></div>
   
    <script src="resources.js"></script>
</body>
</html>
