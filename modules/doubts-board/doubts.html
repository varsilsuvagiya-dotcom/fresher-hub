<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>doubts-board</title>
    <link rel="stylesheet" href="../../shared/theme.css" />
    <link rel="stylesheet" href="../../styles.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "var(--primary)",
              primaryLight: "color-mix(in srgb, var(--primary) 8%, white)",
              primaryHover: "color-mix(in srgb, var(--primary) 15%, white)",
              primaryBorder: "color-mix(in srgb, var(--primary) 25%, white)",
              bg: "var(--bg)",
              text: "var(--text)",
            },
          },
        },
      };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  </head>
  <body
    class="bg-bg text-text min-h-screen flex flex-col"
    style="background-color: var(--bg); color: var(--text)"
  >
    <!-- <a href="../../index.html">&larr; Home</a> -->
    <div id="header-bar"></div>

    <main id="app" class="w-full flex-1 px-4 md:px-36 py-6 space-y-6">
      <header>
        <h1 class="text-2xl md:text-3xl font-bold text-primary mt-2">
          Doubts Board
        </h1>
      </header>

      <!-- Form Section -->
      <section aria-label="Post a doubt">
        <form
          id="doubt-form"
          class="bg-white/80 border border-slate-200 rounded-lg p-4 shadow-sm flex flex-col md:flex-row md:items-end gap-3"
        >
          <div class="w-full md:flex-1">
            <label for="doubt-input" class="block text-sm font-medium mb-1">
              Your doubt
            </label>
            <input
              type="text"
              id="doubt-input"
              placeholder="[What you expected, what happened, what you tried]"
              required
              class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary"
            />
          </div>

          <div
            class="grid grid-cols-2 items-end md:flex md:items-end gap-3 w-full md:w-auto"
          >
            <div class="md:w-44">
              <label for="doubt-topic" class="block text-sm font-medium mb-1">
                Topic
              </label>
              <select
                id="doubt-topic"
                class="w-full border border-slate-300 rounded px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-primary"
              >
                <option value="JavaScript">JavaScript</option>
                <option value="HTML/CSS">HTML/CSS</option>
                <option value="Git">Git</option>
                <option value="General">General</option>
              </select>
            </div>

            <button
              type="submit"
              class="w-full md:w-auto bg-primary text-white font-medium px-4 py-2 rounded text-sm hover:opacity-90 transition cursor-pointer"
              style="background-color: var(--primary)"
            >
              Post doubt
            </button>
          </div>
        </form>
      </section>

      <!-- Filter Buttons -->
      <nav
        aria-label="Filter doubts"
        id="filter-bar"
        class="flex flex-row items-center gap-2"
      >
        <button
          type="button"
          data-filter="all"
          class="filter-btn px-4 py-1.5 rounded text-sm font-medium border border-slate-300 bg-primary text-white cursor-pointer"
          style="background-color: var(--primary)"
        >
          All
        </button>
        <button
          type="button"
          data-filter="open"
          class="filter-btn px-4 py-1.5 rounded text-sm font-medium border border-slate-300 bg-white text-text hover:bg-slate-100 transition cursor-pointer"
        >
          Open
        </button>
        <button
          type="button"
          data-filter="solved"
          class="filter-btn px-4 py-1.5 rounded text-sm font-medium border border-slate-300 bg-white text-text hover:bg-slate-100 transition cursor-pointer"
        >
          Solved
        </button>
      </nav>

      <p
        id="doubt-error"
        class="text-red-600 text-sm font-medium mt-2 hidden"
      ></p>

      <!-- Doubts List Section -->
      <section
        aria-label="Doubts list"
        id="doubts-list"
        class="space-y-3"
      ></section>
    </main>

    <!-- FOOTER -->
    <div id="footer-container"></div>

    <script src="doubts.js"></script>
    <script>
      fetch("../../header.html")
        .then((response) => response.text())
        .then((data) => {
          const headerBar = document.getElementById("header-bar");
          headerBar.innerHTML = data;

          // Fix relative links because doubts.html is inside modules/doubts-board/
          headerBar.querySelectorAll("a[href]").forEach((link) => {
            const href = link.getAttribute("href");
            if (!href.startsWith("http") && !href.startsWith("#")) {
              link.setAttribute("href", "../../" + href);
            }
          });

          // Attach mobile menu toggle AFTER header HTML is injected
          const menuButton = document.getElementById("menuButton");
          const mainNavigation = document.getElementById("mainNavigation");

          if (menuButton && mainNavigation) {
            menuButton.addEventListener("click", () => {
              const isExpanded =
                menuButton.getAttribute("aria-expanded") === "true";
              menuButton.setAttribute("aria-expanded", String(!isExpanded));
              mainNavigation.classList.toggle("hidden");
              mainNavigation.classList.toggle("flex");
            });

            mainNavigation.querySelectorAll("a").forEach((link) => {
              link.addEventListener("click", () => {
                if (window.innerWidth < 768) {
                  mainNavigation.classList.add("hidden");
                  mainNavigation.classList.remove("flex");
                  menuButton.setAttribute("aria-expanded", "false");
                }
              });
            });
          }
        })
        .catch((err) => console.error("Failed to load header:", err));

      // LOAD COMMON FOOTER
      fetch("../../footer.html")
        .then((response) => {
          if (!response.ok) {
            throw new Error("Footer not found");
          }
          return response.text();
        })
        .then((data) => {
          const footerContainer = document.getElementById("footer-container");
          footerContainer.innerHTML = data;

          // Fix relative links because doubts.html is inside modules/doubts-board/
          footerContainer.querySelectorAll("a[href]").forEach((link) => {
            const href = link.getAttribute("href");
            if (!href.startsWith("http") && !href.startsWith("#")) {
              link.setAttribute("href", "../../" + href);
            }
          });

          const currentYear = footerContainer.querySelector("#currentYear");
          if (currentYear) {
            currentYear.textContent = new Date().getFullYear();
          }
        })
        .catch((error) => {
          console.error("Footer Error:", error);
        });
    </script>
  </body>
</html>
